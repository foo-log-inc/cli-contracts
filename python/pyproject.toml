[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-contracts-runtime"
version = "0.36.1"
description = "Python runtime for the programs and command wrappers cli-contracts generates from a CLI contract: commander-compatible argument parsing, help, policy derivation and the built-in extract command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "contract", "codegen", "argument-parsing"]

# No runtime dependency: the runtime uses the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/foo-log-inc/cli-contracts"
Repository = "https://github.com/foo-log-inc/cli-contracts"

[tool.setuptools]
packages = ["cli_contracts_runtime"]

[tool.setuptools.package-data]
cli_contracts_runtime = ["py.typed"]
