name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit (production dependencies)
        # Blocking audit scoped to what a consumer installs: an advisory in a runtime
        # dependency reaches every user of the published package.
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit including dev dependencies (report only)
        # Non-blocking visibility for the dev toolchain, which runs only in CI and on a
        # developer's machine. Fix these when an upstream release makes it possible.
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        # `audit:signatures` runs `npm audit signatures` with the npm version package.json pins, here and
        # in npm-audit-remediate.yml / release.yml. The npm 10 bundled with Node 20 / 22 fails a package
        # whose attestations response carries only the keyless provenance bundle (EMISSINGSIGNATUREKEY);
        # npm 11 requires a registry key only for a keyed (publish) attestation.
        run: npm run audit:signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build
      - name: Verify contract version matches the package version
        run: node dist/cli.js version-sync --check
      - name: Verify the language runtimes' versions match the package version
        run: npm run sync:versions:check
      - name: Test
        run: npm run test:ci
      - name: Conformance vectors (TypeScript, the programs commander runs)
        # The vectors every language's generated program is compared with are what the
        # TypeScript program does; this checks they still are.
        run: npm run conformance -- typescript
      - name: Verify package contents
        run: npm pack --dry-run

  # The programs generated in each language, run with every conformance vector and
  # compared with what the TypeScript program does, and each language's runtime linted.
  languages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [go, rust, python, php]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          # The lowest version the runtime declares (python/pyproject.toml).
          python-version: '3.9'
      - uses: shivammathur/setup-php@v2
        if: matrix.lang == 'php'
        with:
          # The lowest version the runtime declares (php/composer.json).
          php-version: '8.1'
          extensions: mbstring
          tools: none
      - name: Lint the Go runtime
        if: matrix.lang == 'go'
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Lint the Rust runtime
        if: matrix.lang == 'rust'
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo package -p cli_contracts_runtime --allow-dirty
      - name: Build the Rust runtime with the lowest version it declares (rust-version)
        if: matrix.lang == 'rust'
        working-directory: rust
        # Cargo.lock is written in a format cargo 1.70 does not read; the runtime has no
        # dependencies, so the check resolves without it.
        run: |
          rustup toolchain install 1.70.0 --profile minimal
          rm Cargo.lock
          cargo +1.70.0 build -p cli_contracts_runtime
      - name: Compile the Python runtime
        if: matrix.lang == 'python'
        run: python -m compileall -q python/cli_contracts_runtime
      - name: Lint the PHP runtime
        if: matrix.lang == 'php'
        run: for f in php/src/*.php; do php -l "$f"; done
      - name: Conformance vectors
        run: npm run conformance -- ${{ matrix.lang }}
