name: GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "gotag=go/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether release tag exists
        id: tag
        continue-on-error: true
        run: git rev-parse "${{ steps.pkg.outputs.tag }}"
      - name: Stop if release already exists
        if: steps.tag.outcome == 'success'
        run: echo "Release already exists for ${{ steps.pkg.outputs.tag }}"
      - name: Install
        if: steps.tag.outcome == 'failure'
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Audit (production dependencies)
        # Same policy as ci.yml: blocking audit scoped to what a consumer installs.
        if: steps.tag.outcome == 'failure'
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit including dev dependencies (report only)
        # Non-blocking visibility for the dev toolchain. See ci.yml.
        if: steps.tag.outcome == 'failure'
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Verify npm signatures
        if: steps.tag.outcome == 'failure'
        run: npm run audit:signatures
      - name: Lint
        if: steps.tag.outcome == 'failure'
        run: npm run lint --if-present
      - name: Build
        if: steps.tag.outcome == 'failure'
        run: npm run build
      - name: Verify the language runtimes' versions match the package version
        if: steps.tag.outcome == 'failure'
        run: npm run sync:versions:check
      - name: Test
        if: steps.tag.outcome == 'failure'
        run: npm run test:ci
      - name: Verify package contents
        if: steps.tag.outcome == 'failure'
        run: npm pack --dry-run
      - name: Create GitHub Release
        if: steps.tag.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.pkg.outputs.tag }}" \
            --generate-notes
      # The Go runtime is the go/ subtree of the repository; Go resolves its version
      # from a tag go/vX.Y.Z on the commit the release points at. The step creates the
      # tag only when origin does not have it, so a re-run adds a tag a run missed.
      - name: Tag the Go module (go/vX.Y.Z)
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.pkg.outputs.gotag }}" >/dev/null 2>&1; then
            echo "${{ steps.pkg.outputs.gotag }} is already on origin"
            exit 0
          fi
          git tag "${{ steps.pkg.outputs.gotag }}" "${{ github.sha }}"
          git push origin "${{ steps.pkg.outputs.gotag }}"
      # A pushed tag is not a module consumers can get: ask the proxy for the version.
      - name: Verify that the Go module resolves at this version
        run: |
          MODULE=$(awk '$1 == "module" { print $2; exit }' go/go.mod)
          URL="https://proxy.golang.org/${MODULE}/@v/v${{ steps.pkg.outputs.version }}.info"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/goproxy.out -w '%{http_code}' "$URL")
            if [ "$code" = "200" ]; then
              echo "resolves: $(cat /tmp/goproxy.out)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code $(head -c 300 /tmp/goproxy.out)"
            sleep 20
          done
          echo "${MODULE}@v${{ steps.pkg.outputs.version }} does not resolve on proxy.golang.org"
          exit 1
